<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Segoe UI',Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1b232d"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f7a5c"/>
      <stop offset="100%" style="stop-color:#3fb98d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent-grad)"/>

  <!-- Title block -->
  <text x="60" y="72" font-size="13" fill="#3fb98d" font-weight="700" letter-spacing="3" text-transform="uppercase" font-family="'JetBrains Mono',monospace">PHYSICS AI · PINN LITERATURE REVIEW</text>
  <text x="60" y="120" font-size="38" fill="#e6ebf0" font-weight="700" letter-spacing="-1">Physics-Informed Neural Networks</text>
  <text x="60" y="162" font-size="38" fill="#e6ebf0" font-weight="700" letter-spacing="-1">2019 – 2026</text>
  <text x="60" y="200" font-size="18" fill="#aeb8c4">34 landmark studies · animated diagnostics · executable reproductions</text>

  <!-- Divider -->
  <line x1="60" y1="222" x2="1140" y2="222" stroke="#232c37" stroke-width="1.5"/>

  <!-- ── Part I block ── -->
  <rect x="60" y="242" width="500" height="320" rx="10" fill="#141a22" stroke="#232c37" stroke-width="1"/>
  <rect x="60" y="242" width="500" height="4" rx="2" fill="url(#accent-grad)"/>

  <text x="80" y="272" font-size="10" fill="#3fb98d" font-weight="700" letter-spacing="2.5" font-family="'JetBrains Mono',monospace">PART I · 2019 – 2021</text>
  <text x="80" y="298" font-size="17" fill="#9db4de" font-weight="700">Foundations — 17 papers</text>

  <!-- Part I items -->
  <g fill="#aeb8c4" font-size="13.5">
    <text x="80" y="328">● Original PINN: composite loss via autograd</text>
    <text x="80" y="352">● UQ methods: adversarial, Bayesian, dropout</text>
    <text x="80" y="376">● Domain decomp: PPINN, cPINN, XPINN</text>
    <text x="80" y="400">● DeepXDE adaptive refinement (RAR)</text>
    <text x="80" y="424">● DeepONet: operator learning</text>
    <text x="80" y="448">● Stiff-PINN: QSSA model reduction</text>
    <text x="80" y="472">● NTK theory: why training fails</text>
  </g>

  <!-- Part I key result pill -->
  <rect x="80" y="492" width="460" height="52" rx="8" fill="#0f2b22" stroke="#1f7a5c" stroke-width="1"/>
  <text x="100" y="512" font-size="10" fill="#3fb98d" font-weight="700" letter-spacing="2" font-family="'JetBrains Mono',monospace">KEY INSIGHT</text>
  <text x="100" y="532" font-size="12.5" fill="#e6ebf0">Loss components converge at incompatible rates.</text>
  <text x="100" y="548" font-size="12.5" fill="#aeb8c4">NTK eigenspectra reveal why plain PINNs get stuck.</text>

  <!-- ── Part II block ── -->
  <rect x="580" y="242" width="560" height="320" rx="10" fill="#141a22" stroke="#232c37" stroke-width="1"/>
  <rect x="580" y="242" width="560" height="4" rx="2" fill="#b23a3a"/>

  <text x="600" y="272" font-size="10" fill="#e06a6a" font-weight="700" letter-spacing="2.5" font-family="'JetBrains Mono',monospace">PART II · 2022 – 2026</text>
  <text x="600" y="298" font-size="17" fill="#9db4de" font-weight="700">Failure modes and remedies — 17 papers</text>

  <!-- Part II items -->
  <g fill="#aeb8c4" font-size="13.5">
    <text x="600" y="328">● Gradient pathologies and loss imbalance</text>
    <text x="600" y="352">● Spectral bias + Fourier feature networks</text>
    <text x="600" y="376">● Sampling failures and R3 evolutionary sampling</text>
    <text x="600" y="400">● Causality violation in time-dependent PDEs</text>
    <text x="600" y="424">● PINNacle: first standardized PDE benchmark</text>
    <text x="600" y="448">● PirateNets: residual-adaptive architectures</text>
    <text x="600" y="472">● Spurious solutions and pseudo-time stepping</text>
  </g>

  <!-- Part II key result pill -->
  <rect x="600" y="492" width="520" height="52" rx="8" fill="#2a1616" stroke="#b23a3a" stroke-width="1"/>
  <text x="620" y="512" font-size="10" fill="#e06a6a" font-weight="700" letter-spacing="2" font-family="'JetBrains Mono',monospace">HONEST FINDING</text>
  <text x="620" y="532" font-size="12.5" fill="#e6ebf0">PINNs are not universal PDE solvers.</text>
  <text x="620" y="548" font-size="12.5" fill="#aeb8c4">Real strength: inverse problems and sparse-data fusion.</text>

  <!-- Stats row -->
  <g>
    <rect x="60" y="578" width="160" height="44" rx="8" fill="#1b232d" stroke="#313d4a" stroke-width="1"/>
    <text x="140" y="596" text-anchor="middle" font-size="22" fill="#3fb98d" font-weight="800" font-family="'JetBrains Mono',monospace">34</text>
    <text x="140" y="612" text-anchor="middle" font-size="10" fill="#7c8794" letter-spacing="1.5" font-family="'JetBrains Mono',monospace">PAPERS</text>

    <rect x="240" y="578" width="180" height="44" rx="8" fill="#1b232d" stroke="#313d4a" stroke-width="1"/>
    <text x="330" y="596" text-anchor="middle" font-size="22" fill="#3fb98d" font-weight="800" font-family="'JetBrains Mono',monospace">34</text>
    <text x="330" y="612" text-anchor="middle" font-size="10" fill="#7c8794" letter-spacing="1.5" font-family="'JetBrains Mono',monospace">ANIMATIONS</text>

    <rect x="440" y="578" width="200" height="44" rx="8" fill="#1b232d" stroke="#313d4a" stroke-width="1"/>
    <text x="540" y="596" text-anchor="middle" font-size="22" fill="#3fb98d" font-weight="800" font-family="'JetBrains Mono',monospace">6</text>
    <text x="540" y="612" text-anchor="middle" font-size="10" fill="#7c8794" letter-spacing="1.5" font-family="'JetBrains Mono',monospace">NOTEBOOKS</text>

    <rect x="660" y="578" width="180" height="44" rx="8" fill="#1b232d" stroke="#313d4a" stroke-width="1"/>
    <text x="750" y="596" text-anchor="middle" font-size="22" fill="#3fb98d" font-weight="800" font-family="'JetBrains Mono',monospace">7yr</text>
    <text x="750" y="612" text-anchor="middle" font-size="10" fill="#7c8794" letter-spacing="1.5" font-family="'JetBrains Mono',monospace">LITERATURE</text>

    <!-- Author -->
    <text x="1140" y="596" text-anchor="end" font-size="13" fill="#3fb98d" font-weight="600">Ali Shahmohammadi, Ph.D.</text>
    <text x="1140" y="614" text-anchor="end" font-size="11" fill="#7c8794">alishahmohammadi22.github.io</text>
  </g>
</svg>
